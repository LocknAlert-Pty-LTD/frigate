services:
  # Full production Frigate, built from the real "frigate" image target (not
  # the devcontainer's placeholder). This is what runs on a plain
  # `docker compose up` -- self-contained, no source bind-mount, no manual
  # `python3 -m frigate` needed. The devcontainer service below is for VS
  # Code development instead and is gated behind a profile so it doesn't
  # also start (and fight over the same ports) by default.
  frigate:
    container_name: frigate
    restart: unless-stopped
    # Name of the image this builds. Override FRIGATE_IMAGE (env var or a .env
    # file next to this compose file) to build here and push for the server:
    #
    #   FRIGATE_IMAGE=docker.io/<user>/frigate:tensorrt docker compose build
    #   docker login
    #   FRIGATE_IMAGE=docker.io/<user>/frigate:tensorrt docker compose push
    #
    # then on the Ubuntu server, with the same FRIGATE_IMAGE set:
    #   docker compose pull && docker compose up -d
    image: ${FRIGATE_IMAGE:-frigate:latest-tensorrt}
    build:
      context: .
      # The TensorRT target lives in the main Dockerfile so that compose can
      # build it directly. docker/tensorrt/Dockerfile.amd64 builds the same two
      # stages but takes wheels/deps/rootfs in as named build contexts, which
      # only `docker buildx bake` can supply -- compose has no equivalent of
      # bake's `target:` references. The two definitions are kept identical and
      # frigate/test/test_tensorrt_dockerfile_parity.py enforces that.
      #
      # For the plain CPU/iGPU image instead, change this to `target: frigate`.
      dockerfile: docker/main/Dockerfile
      target: frigate-tensorrt
      # Pinned so an image built on a dev machine always matches an x86_64
      # Ubuntu server, rather than inheriting the builder's architecture.
      platforms:
        - linux/amd64
      cache_from:
        - ghcr.io/blakeblackshear/frigate:cache-amd64
    # Each 1080p camera stream needs roughly 50MB of shared memory; raise
    # this if you add more cameras. See:
    # https://docs.frigate.video/frigate/installation#calculating-required-shm-size
    shm_size: "256mb"
    # Run-time only: `docker compose build` ignores this, so a machine with no
    # NVIDIA GPU can still build the image to push. Needs the NVIDIA Container
    # Toolkit on whichever host actually runs it.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # devices:
      # - /dev/bus/usb:/dev/bus/usb # Uncomment for Google Coral USB
      # - /dev/dri:/dev/dri # Uncomment for Intel/AMD hwaccel, may need updating for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971" # authenticated UI/API -- safe to expose beyond your local network
      - "5000:5000" # unauthenticated UI/API -- only expose this on a trusted network
      - "8554:8554" # RTSP restream
      - "8555:8555/tcp" # WebRTC over TCP
      - "8555:8555/udp" # WebRTC over UDP
    depends_on:
      - mqtt

  
  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2.0
    command: mosquitto -c /mosquitto-no-auth.conf # enable no-auth mode
    ports:
      - "1883:1883"
